###############################################################################
# SYSTEM CONFIGURATION
#
# Copy this file to:
#
#   config/system.conf
#
# and edit the values according to your installation.
###############################################################################

###############################################################################
# REPOSITORY
###############################################################################

REPO_DIR="/path/to/clinical-genomics-workflow-optimization"

###############################################################################
# INPUT DATA
###############################################################################

# Directory containing one folder per sample

SAMPLES_DIR="/path/to/samples"

# Example:
#
# SAMPLES_DIR=/data/exomes
#
# Expected structure:
#
# /data/exomes/
# ├── SAMPLE_001/
# │   ├── HPO_terms.txt
# │   ├── SAMPLE_001.vcf
# │   ├── SAMPLE_001_filtered_sorted_hg38.vcf
# │   └── SAMPLE_001_gnomad_values_hg38.txt
# └── SAMPLE_002/
#

###############################################################################
# TEMPLATES
###############################################################################

# Exomiser templates path

TEMPLATE_DIR="${REPO_DIR}/templates"

###############################################################################
# REFERENCE VERSIONS
###############################################################################

# Exomiser version

EXOMISER_VERSION="14.1.0"

EXOMISER_JAR="exomiser-cli-${EXOMISER_VERSION}.jar"

# LIRICAL version

LIRICAL_VERSION="2.0.4"

LIRICAL_JAR="lirical-cli-${LIRICAL_VERSION}.jar"

# LIRICAL database version

LIRICAL_DB_VERSION="2302_hg38"

# Genome build

GENOME_BUILD="hg38"

###############################################################################
# IMPORTANT NOTES
###############################################################################

# AMELIE VCF mode was originally benchmarked using hg19 VCF files.
# Users should ensure coordinate compatibility before running
# VCF-based AMELIE analyses.


###############################################################################
# EXOMISER
###############################################################################

# Exomiser installation path

EXOMISER_DIR="/path/to/exomiser"

# Exomiser database path

EXOMISER_DATA_DIR="/path/to/exomiser/data"

EXOMISER_TEMPLATE="${TEMPLATE_DIR}/analysis-exome.yml"

###############################################################################
# LIRICAL
###############################################################################

# LIRICAL installation path

LIRICAL_DIR="/path/to/lirical"

# LIRICAL database path

EXOMISER_DB="/path/to/${LIRICAL_DB_VERSION}_variants.mv.db"

###############################################################################
# AMELIE
###############################################################################

# No API key is required for the public AMELIE API.
# Check Stanford AMELIE documentation for usage limits.

AMELIE_GENE_API="https://amelie.stanford.edu/api/gene_list_api/"
AMELIE_VCF_API="https://amelie.stanford.edu/api/vcf_api/"

###############################################################################
# REFERENCE FILES
###############################################################################

# RefGene file path

REFGENE_DIR="/path/to/reference"

REFGENE_FILE="${REFGENE_DIR}/refGene_hg38_chrOK.txt"

###############################################################################
# CONFIGURATION DIRECTORIES
###############################################################################

EXOMISER_PROFILE_DIR="${REPO_DIR}/config/exomiser_profiles"

LIRICAL_PROFILE_DIR="${REPO_DIR}/config/lirical_profiles"

AMELIE_PROFILE_DIR="${REPO_DIR}/config/amelie_profiles"

###############################################################################
# SCRIPT DIRECTORY
###############################################################################

SCRIPT_DIR="${REPO_DIR}/scripts"

###############################################################################
# OUTPUT DIRECTORIES
###############################################################################

# Example:
#
# Expected structure:
#
# results/
# ├── exomiser/
# ├── lirical/
# ├── amelie/
# ├── integration/
# ├── analysis/
# └── figures/

RESULTS_DIR="${REPO_DIR}/results"

EXOMISER_RESULTS_DIR="${RESULTS_DIR}/exomiser"

LIRICAL_RESULTS_DIR="${RESULTS_DIR}/lirical"

AMELIE_RESULTS_DIR="${RESULTS_DIR}/amelie"

INTEGRATION_RESULTS_DIR="${RESULTS_DIR}/integration"

ANALYSIS_DIR="${RESULTS_DIR}/analysis"

FIGURES_DIR="${RESULTS_DIR}/figures"

LOG_DIR="${REPO_DIR}/logs"

# Temporary directory

TMP_DIR="${REPO_DIR}/tmp"

###############################################################################
# THREADS
###############################################################################

THREADS=8

###############################################################################
# JAVA
###############################################################################

# Java run path

JAVA_BIN="java"

###############################################################################
# PYTHON
###############################################################################

# Python run path

PYTHON_BIN="python3"


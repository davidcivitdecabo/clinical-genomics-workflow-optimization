###############################################################################
# SYSTEM CONFIGURATION
#
# Copy this file to:
#
#   config/system.conf
#
# and edit the values according to your installation.
###############################################################################

###############################################################################
# REPOSITORY
###############################################################################

REPO_DIR="/path/to/clinical-genomics-workflow-optimization"

###############################################################################
# INPUT DATA
###############################################################################

# Directory containing one folder per sample

SAMPLES_DIR="/path/to/samples"

# Example:
#
# SAMPLES_DIR=/data/exomes
#
# Expected structure:
#
# /data/exomes/
# ├── SAMPLE_001/
# │   ├── HPO_terms.txt
# │   ├── sample.vcf
# │   └── ...
# └── SAMPLE_002/
#

###############################################################################
# TEMPLATES
###############################################################################

TEMPLATE_DIR="${REPO_DIR}/templates"

###############################################################################
# REFERENCE VERSIONS
###############################################################################

EXOMISER_VERSION="14.1.0"

LIRICAL_VERSION="2.0.4"

# Genome build

GENOME_BUILD="hg38"

###############################################################################
# IMPORTANT NOTES
###############################################################################

# AMELIE VCF mode was originally benchmarked using hg19 VCF files.
# Users should ensure coordinate compatibility before running
# VCF-based AMELIE analyses.


###############################################################################
# EXOMISER
###############################################################################

EXOMISER_DIR="/path/to/exomiser"

EXOMISER_JAR="exomiser-cli-14.1.0.jar"

EXOMISER_DATA_DIR="/path/to/exomiser/data"

EXOMISER_TEMPLATE="${TEMPLATE_DIR}/analysis-exome.yml"

###############################################################################
# LIRICAL
###############################################################################

LIRICAL_DIR="/path/to/lirical"

LIRICAL_JAR="lirical-cli-2.0.4.jar"

EXOMISER_DB="/path/to/2302_hg38_variants.mv.db"

###############################################################################
# AMELIE
###############################################################################

# Stanford AMELIE API endpoint

AMELIE_GENE_API="https://amelie.stanford.edu/api/gene_list_api/"
AMELIE_VCF_API="https://amelie.stanford.edu/api/vcf_api/"

###############################################################################
# REFERENCE FILES
###############################################################################

REFGENE_DIR="/path/to/reference"

REFGENE_FILE="${REFGENE_DIR}/refGene_hg38_chrOK.txt"

###############################################################################
# CONFIGURATION DIRECTORIES
###############################################################################

EXOMISER_PROFILE_DIR="${REPO_DIR}/config/exomiser_profiles"

LIRICAL_PROFILE_DIR="${REPO_DIR}/config/lirical_profiles"

AMELIE_PROFILE_DIR="${REPO_DIR}/config/amelie_profiles"

###############################################################################
# SCRIPT DIRECTORY
###############################################################################

SCRIPT_DIR="${REPO_DIR}/scripts"

###############################################################################
# OUTPUT DIRECTORIES
###############################################################################

RESULTS_DIR="${REPO_DIR}/results"

BENCHMARK_DIR="${RESULTS_DIR}/benchmark"

BENCHMARK_EXOMISER_DIR="${BENCHMARK_DIR}/exomiser"

BENCHMARK_LIRICAL_DIR="${BENCHMARK_DIR}/lirical"

BENCHMARK_AMELIE_DIR="${BENCHMARK_DIR}/amelie"

BENCHMARK_COMBINED_DIR="${BENCHMARK_DIR}/combined"

ANALYSIS_DIR="${RESULTS_DIR}/analysis"

FIGURES_DIR="${RESULTS_DIR}/figures"

LOG_DIR="${REPO_DIR}/logs"

# Temporary directory

TMP_DIR="/tmp"


###############################################################################
# THREADS
###############################################################################

THREADS=8

###############################################################################
# JAVA
###############################################################################

JAVA_BIN="java"

###############################################################################
# PYTHON
###############################################################################

PYTHON_BIN="python3"


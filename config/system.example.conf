#!/usr/bin/env bash

###############################################################################
# SYSTEM CONFIGURATION
#
# Copy this file to:
#
#   config/system.conf
#
# and edit the values according to your installation.
###############################################################################

###############################################################################
# REPOSITORY
###############################################################################

REPO_DIR="/path/to/clinical-genomics-workflow-optimization"

###############################################################################
# INPUT DATA
###############################################################################

# Directory containing one folder per sample

SAMPLES_DIR="/path/to/samples"

# Example:
#
# SAMPLES_DIR=/data/exomes
#
# Expected structure:
#
# /data/exomes/
# ├── SAMPLE_001/
# │   ├── HPO_terms.txt
# │   ├── sample.vcf
# │   └── ...
# └── SAMPLE_002/
#

###############################################################################
# EXOMISER
###############################################################################

EXOMISER_DIR="/path/to/exomiser"

EXOMISER_JAR="exomiser-cli-14.1.0.jar"

EXOMISER_DATA_DIR="/path/to/exomiser/data"

EXOMISER_TEMPLATE="${EXOMISER_DIR}/templates/analysis-exome.yml"

###############################################################################
# LIRICAL
###############################################################################

LIRICAL_DIR="/path/to/lirical"

LIRICAL_JAR="lirical-cli-2.0.4.jar"

EXOMISER_DB="/path/to/2302_hg38_variants.mv.db"

###############################################################################
# AMELIE
###############################################################################

# Stanford AMELIE API endpoint

AMELIE_GENE_API="https://amelie.stanford.edu/api/gene_list_api/"
AMELIE_VCF_API="https://amelie.stanford.edu/api/vcf_api/"

###############################################################################
# REFERENCE FILES
###############################################################################

REFGENE_DIR="/path/to/reference"

REFGENE_FILE="${REFGENE_DIR}/refGene_hg38_chrOK.txt"

###############################################################################
# OUTPUT DIRECTORIES
###############################################################################

RESULTS_DIR="${REPO_DIR}/results"

BENCHMARK_DIR="${RESULTS_DIR}/benchmark"

ANALYSIS_DIR="${RESULTS_DIR}/analysis"

FIGURES_DIR="${RESULTS_DIR}/figures"

LOG_DIR="${RESULTS_DIR}/logs"

###############################################################################
# THREADS
###############################################################################

THREADS=8

###############################################################################
# JAVA
###############################################################################

JAVA_BIN="java"

###############################################################################
# OPTIONAL
###############################################################################

# Genome build

GENOME_BUILD="hg38"

# Temporary directory

TMP_DIR="/tmp"

###############################################################################
# LOGGING
###############################################################################

TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
